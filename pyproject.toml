[project]
name = "pools-closed"
version = "0.1.0"
description = "Adult Swim website wrapper."
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "ryn-cx", email = "262888154+ryn-cx@users.noreply.github.com" }
]
dependencies = [
  "get-around",
  "good-ass-pydantic-integrator",
]

[dependency-groups]
dev = [
  "get-around",
  "prek>=0.4.8",
  "pytest>=8.4.2",
  "ruff>=0.13.3",
  "ty>=0.0.72",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ty.src]
exclude = ["**/models.py", "**/optional_models.py", "**/strict_models.py"]

[[tool.mypy.overrides]]
module = ["*.models", "models", "*.optional_models", "*.strict_models"]
ignore_errors = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001",  # Copyright information is stored in LICENSE.
  "FIX002",  # TODO comments are allowed.
  "TD002",  # TODO comments do not need an author.
  "TD003",  # TODO comments do not need an issue link.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D"]  # Asserts and missing docstrings allowed in tests.
"**/models.py" = ["ALL"]  # Generated by generate/generate_models.py.
"**/optional_models.py" = ["ALL"]  # Generated by generate/generate_models.py.
"**/strict_models.py" = ["ALL"]  # Generated by generate/generate_models.py.

[tool.uv.sources]
get-around = { git = "https://github.com/ryn-cx/get-around" }
good-ass-pydantic-integrator = { git = "https://github.com/ryn-cx/good-ass-pydantic-integrator" }
